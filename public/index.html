<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UCL Predictor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    .header { position: sticky; top: 0; background: rgba(15,23,42,0.95); backdrop-filter: blur(8px); padding: 10px 16px; display: flex; justify-content: flex-end; align-items: center; border-bottom: 1px solid var(--border); z-index: 90; }
    .header-balance { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 8px 14px; background: rgba(59,130,246,0.15); border-radius: 22px; border: 1px solid rgba(59,130,246,0.3); cursor: pointer; transition: background 0.2s; }
    .header-balance:hover { background: rgba(59,130,246,0.25); }
    .header-balance .coin { font-size: 15px; }
    .header-balance .today-amount { font-weight: 700; }
    .header-balance .today-amount.pos { color: var(--success); }
    .header-balance .today-amount.neg { color: var(--danger); }
    .header-balance .today-amount.zero { color: var(--muted); }
    .level-badge { font-size: 10px; color: var(--muted); padding-left: 8px; border-left: 1px solid var(--border); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 env(safe-area-inset-bottom); border-top: 1px solid var(--border); z-index: 100; }
    .nav-item { background: none; border: none; color: var(--muted); padding: 8px 20px; border-radius: 10px; cursor: pointer; transition: color 0.2s, background 0.2s; display: flex; align-items: center; justify-content: center; }
    .nav-item.active { color: var(--primary); background: rgba(59,130,246,0.12); }
    .nav-item svg { width: 26px; height: 26px; display: block; }
    #app { padding: 16px; max-width: 600px; margin: 0 auto; }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; justify-content: space-between; }
    .section-header h2 { font-size: 20px; }
    .badge { background: var(--primary); color: white; font-size: 12px; padding: 2px 8px; border-radius: 12px; }
    .loading, .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state.error { color: var(--danger); }
    .empty-state.compact { padding: 20px; }
    .muted { color: var(--muted); font-size: 13px; }
    .match-card, .prediction-item { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .match-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .vs { color: var(--muted); font-weight: 400; margin: 0 4px; }
    .check-mark { color: var(--success); margin-left: 6px; }
    .status { font-size: 12px; font-weight: 500; margin-top: 6px; }
    .status-scheduled { color: var(--primary); }
    .status-live { color: var(--success); }
    .status-finished { color: var(--muted); }
    .score-line, .prediction-line, .result-line { font-size: 14px; margin-top: 6px; }
    .match-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 500; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .primary-button { background: var(--primary); color: white; padding: 10px 16px; }
    .secondary-button { background: rgba(255,255,255,0.1); color: var(--text); padding: 10px 16px; }
    .full-width { width: 100%; margin-top: 12px; }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-bar button { padding: 8px 12px; font-size: 13px; background: rgba(255,255,255,0.08); color: var(--muted); }
    .filter-bar button.active { background: var(--primary); color: white; }
    .standings-sort-bar { align-items: center; }
    .responsive-table { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--border); }
    th { background: rgba(255,255,255,0.03); color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .table-sort { background: none; color: inherit; padding: 4px 6px; font-size: 13px; font-weight: 600; }
    .link-button, .metric-button { background: none; border: none; color: var(--text); text-decoration: underline; cursor: pointer; padding: 2px 4px; }
    .metric-button { text-decoration: none; font-weight: 600; color: var(--primary); }
    .metric-button.metric-points { color: #fff !important; font-size: 15px; font-weight: 700; text-decoration: none; }
    .round-points { color: #fff !important; font-size: 15px; font-weight: 700; }
    .position-arrow { display: inline-block; margin-left: 4px; font-weight: bold; font-size: 11px; vertical-align: middle; }
    .position-arrow.up { color: var(--success); }
    .position-arrow.down { color: var(--danger); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-card { background: var(--card); border-radius: 16px; width: 100%; max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 16px; }
    .icon-button { background: none; color: var(--muted); font-size: 20px; line-height: 1; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .modal-bottom-close { margin: 0 16px 16px; }
    .score-inputs { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 12px 0; }
    .score-inputs label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    .score-inputs input { width: 70px; padding: 10px; text-align: center; font-size: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .score-separator { font-size: 24px; color: var(--muted); }
    .past-toggle { width: 100%; margin: 16px 0; background: rgba(255,255,255,0.05); color: var(--muted); }
    .hidden { display: none; }
    .past-day h3 { font-size: 14px; color: var(--muted); margin: 16px 0 8px; text-transform: capitalize; }
    .prediction-exact { border-left: 3px solid var(--success); }
    .chart-container { position: relative; height: 280px; width: 100%; }
    .standings-hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .odds-line { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; margin-bottom: 2px; }
    .odds-item { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.08); font-size: 12px; color: #fff; }
    .odds-item strong { color: var(--success); font-size: 13px; }

    .form-label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; }
    .form-input { width: 100%; padding: 10px 12px; font-size: 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
    .form-input:focus { outline: none; border-color: var(--primary); }
    select.form-input { appearance: none; }

    .duel-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 10px; margin-bottom: 16px; }
    .duel-tab { flex: 1; background: none; border: none; color: var(--muted); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .duel-tab.active { background: var(--primary); color: white; }
    .duel-card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
    .duel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .duel-teams { font-weight: 600; font-size: 15px; }
    .duel-stake { background: rgba(59,130,246,0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .duel-meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .duel-participants { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
    .duel-actions { display: flex; gap: 8px; margin-top: 10px; }
    .duel-actions button { flex: 1; }
    .duel-my-bet { font-size: 13px; margin: 8px 0; padding: 8px 10px; background: rgba(255,255,255,0.04); border-radius: 8px; border-left: 3px solid var(--primary); }
    .duel-result-winner { color: var(--success); font-weight: 700; }
    .duel-result-loser { color: var(--danger); }
    .duel-result-refunded { color: var(--muted); }

    /* Тосты */
    .toast-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: 90vw; }
    .toast { background: var(--card); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; color: var(--text); box-shadow: 0 4px 20px rgba(0,0,0,0.4); animation: toast-in 0.2s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* Баланс / уровни / транзакции */
    .balance-total { font-size: 18px; margin-bottom: 4px; }
    .modal-section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; font-weight: 600; }
    .modal-section-title:first-child { margin-top: 0; }
    .today-summary { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; }
    .today-total { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .today-breakdown { list-style: none; }
    .today-breakdown li { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .levels-list { display: flex; flex-direction: column; gap: 4px; }
    .level-row { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; align-items: center; }
    .level-row.level-current { background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); }
    .level-num { color: var(--muted); font-weight: 600; }
    .level-name { font-weight: 500; }
    .level-req { color: var(--muted); font-size: 12px; }
    .level-bonus { color: var(--success); font-weight: 600; font-size: 12px; }
    .tx-list { list-style: none; }
    .tx-list li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; align-items: center; }
    .tx-list li:last-child { border-bottom: none; }
    .tx-list li .tx-sub { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tx-amount { font-weight: 600; }

    /* Профиль */
    .profile-section { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .profile-section:first-child { padding-top: 0; }
    .profile-section:last-of-type { border-bottom: none; }
    .profile-balance { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .profile-level-click { cursor: pointer; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 10px; margin: 12px 0; transition: background 0.2s; }
    .profile-level-click:hover { background: rgba(255,255,255,0.08); }
    .profile-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .profile-badge { background: rgba(59,130,246,0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-balance" id="header-clickable" title="Нажмите, чтобы увидеть все начисления">
      <span class="coin">🪙</span>
      <span id="today-value" class="today-amount zero">—</span>
      <span class="level-badge" id="level-badge" style="display:none"></span>
    </div>
  </header>
  <div id="app"></div>
  <nav class="nav-bar">
    <button id="nav-matches" class="nav-item active" aria-label="Матчи">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="2" y="5" width="20" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
        <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2 9.5h3v5H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 9.5h-3v5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="nav-my-predictions" class="nav-item" aria-label="Мои прогнозы">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.8"/>
        <polygon points="12,7.2 15.2,9.5 14,13.3 10,13.3 8.8,9.5" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <line x1="12" y1="7.2" x2="12" y2="2.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="15.2" y1="9.5" x2="20.5" y2="8.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="14" y1="13.3" x2="17" y2="18.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="10" y1="13.3" x2="7" y2="18.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="8.8" y1="9.5" x2="3.5" y2="8.5" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <button id="nav-standings" class="nav-item" aria-label="Таблица">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3" y="14" width="5" height="7" rx="0.8" stroke="currentColor" stroke-width="1.8"/>
        <rect x="9.5" y="9" width="5" height="12" rx="0.8" stroke="currentColor" stroke-width="1.8"/>
        <rect x="16" y="12" width="5" height="9" rx="0.8" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>
    <button id="nav-duels" class="nav-item" aria-label="Дуэли">
      <svg viewBox="0 0 24 24" fill="none">
        <line x1="4" y1="4" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="6" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="18" y1="18" x2="21" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="18" x2="3" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15.5" y1="16.5" x2="18.5" y2="13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="8.5" y1="16.5" x2="5.5" y2="13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </nav>
  <div class="toast-container" id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
